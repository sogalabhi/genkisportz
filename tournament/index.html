<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tournament Invite - Genki Sports</title>
    <meta
      name="description"
      content="Open tournament invite in Genki Sports app."
    />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-[#171E14] text-white font-sans antialiased m-0">
    <main class="max-w-2xl mx-auto px-4 py-8 sm:py-12">
      
      <h1 class="text-3xl font-bold mb-4 text-white">App Not Installed</h1>
      
      <p id="inviteSummary" class="text-[#E0E0E0] text-base mb-6">
        This tournament invite can be opened in the Genki Sports app.
      </p>

      <div class="bg-[#1F2E18] border border-[#243128] rounded-[24px] p-5 my-4 shadow-sm">
        <p class="mb-2">
          <strong class="text-white">Tournament ID:</strong> 
          <span id="targetId" class="inline-block bg-[#000000] rounded-[16px] px-3 py-1 font-mono text-sm ml-1 text-[#E0E0E0]">-</span>
        </p>
        <p>
          <strong class="text-white">Invite code:</strong> 
          <span id="inviteCode" class="inline-block bg-[#000000] rounded-[16px] px-3 py-1 font-mono text-sm ml-1 text-[#E0E0E0]">-</span>
        </p>
      </div>

      <div class="flex flex-col sm:flex-row gap-3 mt-6 mb-8">
        <button 
          id="openInAppBtn" 
          class="w-full sm:w-auto px-5 py-3 bg-[#4D882F] hover:bg-[#3A6623] text-white rounded-[16px] text-sm font-medium transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-[#4D882F] focus:ring-offset-2 focus:ring-offset-[#171E14]"
        >
          Open in App
        </button>
        <button 
          id="copyInviteBtn" 
          class="w-full sm:w-auto px-5 py-3 bg-[#243128] hover:bg-[#4A6741] text-white rounded-[16px] text-sm font-medium transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-[#4A6741] focus:ring-offset-2 focus:ring-offset-[#171E14]"
        >
          Copy Invite Link
        </button>
      </div>

      <p class="text-[#9E9E9E] text-sm mb-4">App Store links are coming soon.</p>
      
      <div class="bg-[#1F2E18] border border-[#243128] rounded-[24px] p-5 my-4">
        <p class="text-sm leading-relaxed text-[#9E9E9E]">
          If this link was opened inside an Instagram/Facebook/other in-app browser,
          open it in your device browser from the menu and try again.
        </p>
      </div>
      
    </main>

    <script src="/assets/app.js"></script>
  </body>
</html>
