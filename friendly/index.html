<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friendly Invite - Genki Sports</title>
    <meta name="description" content="Open friendly invite in Genki Sports app." />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>App Not Installed</h1>
      <p id="inviteSummary">This friendly invite can be opened in the app.</p>
      <div class="panel">
        <p><strong>Booking ID:</strong> <span id="targetId">-</span></p>
        <p><strong>Invite code:</strong> <span id="inviteCode">-</span></p>
      </div>
      <div class="actions">
        <button id="openInAppBtn" class="btn btn-primary">Open in App</button>
        <button id="copyInviteBtn" class="btn btn-secondary">Copy Invite Link</button>
      </div>
    </main>
    <script src="/assets/app.js"></script>
  </body>
</html>
