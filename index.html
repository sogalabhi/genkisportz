<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Genki Sports Links</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Genki Sports Link Gateway</h1>
      <p>
        This domain handles tournament invite links and opens the Genki Sports
        app when available.
      </p>
      <div class="panel">
        <p><strong>Expected invite URL format</strong></p>
        <code>https://genkisportz.in/tournament/&lt;id&gt;?invite=&lt;token&gt;</code>
      </div>
      <p class="muted">
        If you reached this page from an invite, open the full link from your
        chat app again.
      </p>
    </main>
  </body>
</html>
